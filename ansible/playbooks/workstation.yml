---
- name: Configure Ubuntu workstations
  hosts: workstations
  gather_facts: true

  roles:
    - hardware
    - base
    - shell
    - bootstrap
    - languages
    - containers
    - virtualization

    - role: gnome
      when: workstation_hardware_has_gnome_session | default(false) | bool

    - syncthing
    - proton
    - backup
    - maintenance

    - health
    - drift
    
    - role: backup_monitor
      when:
        - workstation_backup_enabled | default(false) | bool
        - workstation_backup_timer_enabled | default(false) | bool
    
    - weekly_report
    - desktop_alerts
    - tool_updates
    - tool_update_alerts
    - tool_update_policy
    - apt_update_review
    - post_update_validation
    - release_audit
