---
- name: Configure Ubuntu workstations
  hosts: workstations
  gather_facts: true

  vars:
    providers_root: "{{ (playbook_dir ~ '/../roles/providers') | realpath }}"

  pre_tasks:
    - name: Assert supported platform and minimum tool versions
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == workstation_supported_distribution
          - ansible_facts['distribution_version'] == workstation_supported_release
          - ansible_version.full is version(workstation_min_ansible_core, '>=')
          - ansible_facts['python_version'] is version(workstation_min_python, '>=')
        fail_msg: >-
          Unsupported platform: this repository targets
          {{ workstation_supported_distribution }} {{ workstation_supported_release }},
          ansible-core >= {{ workstation_min_ansible_core }},
          Python >= {{ workstation_min_python }}.
          Found: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }},
          ansible-core {{ ansible_version.full }}, Python {{ ansible_facts['python_version'] }}.
          See docs/DEPLOY.md section 2 (prerequisites and release compatibility).

    # Machine identity: the runtime hostname is the default identity and is
    # never stored in Git. A host may optionally pin workstation_device_name
    # (e.g. in a gitignored host_vars/<host>/local.yml); placeholder values
    # starting with '<' are skipped by both assertions below.
    - name: Assert the declared machine identity matches this host
      ansible.builtin.assert:
        that:
          - workstation_device_name | default(ansible_facts['hostname']) == ansible_facts['hostname']
        fail_msg: >-
          Declared workstation_device_name '{{ workstation_device_name | default('') }}'
          does not match the runtime hostname '{{ ansible_facts['hostname'] }}'.
          Fix the inventory/host_vars entry for this machine; do not clone identities between hosts.
      when:
        - (workstation_device_name | default('')) != ''
        - not (workstation_device_name | default('') is match('^<'))

    - name: Gather declared machine identities of all inventory hosts
      ansible.builtin.set_fact:
        workstation_all_identities: >-
          {{ workstation_all_identities | default([])
             + [hostvars[item]['workstation_device_name'] | default('')] }}
      loop: "{{ groups['workstations'] }}"

    - name: Assert unique declared machine identities across the whole inventory
      ansible.builtin.assert:
        that:
          - workstation_declared_identities | unique | length == workstation_declared_identities | length
          - groups['workstations'] | unique | length == groups['workstations'] | length
        fail_msg: >-
          Duplicate declared workstation_device_name across inventory hosts:
          {{ workstation_declared_identities | join(', ') }}.
          Each machine needs a unique declared identity (pin it in a gitignored
          host_vars/<host>/local.yml); provisioning must never clone hostname,
          backup destination or device identity.
      vars:
        # Empty (runtime-facts fallback) and '<placeholder>' values are not
        # declared identities and are excluded from the uniqueness check.
        workstation_declared_identities: >-
          {{ workstation_all_identities | select('ne', '') | reject('match', '^<') | list }}

    - name: Discover available profiles
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../../profiles"
        patterns: "*.yml"
        file_type: file
      register: workstation_profile_files

    - name: Validate the selected profile
      ansible.builtin.assert:
        that:
          - workstation_profile in workstation_available_profiles
        fail_msg: >-
          Unknown profile '{{ workstation_profile }}'.
          Available profiles: {{ workstation_available_profiles | join(', ') }}.
          Add your own at profiles/<name>.yml (see docs/DEPLOY.md section 8, CONTRIBUTING.md).
      vars:
        workstation_available_profiles: "{{ workstation_profile_files.files | map(attribute='path') | map('basename') | map('regex_replace', '\\.yml$', '') | list | sort }}"

    - name: Discover available provider roles
      ansible.builtin.find:
        paths: "{{ providers_root }}"
        recurse: true
        file_type: file
      register: workstation_provider_files

    - name: Validate that every selected provider role exists
      ansible.builtin.assert:
        that:
          - workstation_providers[item.key] in workstation_available_providers
        fail_msg: >-
          Unknown provider '{{ workstation_providers[item.key] }}' for capability '{{ item.key }}'.
          Available providers: {{ workstation_available_providers | join(', ') }}.
          Add your own at ansible/roles/providers/<vendor>/<name>/ (docs/PROVIDERS.md, CONTRIBUTING.md)
          or select an available provider (use 'none' to skip a capability).
      vars:
        # Every role directory under providers/ (vendor/name or flat name) with
        # tasks/main.yml; directories whose name starts with '_' are helpers.
        workstation_available_providers: >-
          {{ workstation_provider_files.files | map(attribute='path')
             | select('search', '/tasks/main\.yml$')
             | map('regex_replace', '^' ~ (providers_root | regex_escape) ~ '/', '')
             | map('regex_replace', '/tasks/main\.yml$', '')
             | reject('search', '(^|/)_')
             | list | sort }}
      loop: "{{ workstation_capabilities | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.value.enabled | default(true) | bool
        - workstation_providers[item.key] | default('') != 'none'

    # Capability/provider selection (defaults reproduce the original Proton +
    # Syncthing setup). include_role is used so a skipped or 'none' provider
    # never resolves a missing role name.
    - name: Select sync provider
      ansible.builtin.include_role:
        name: "providers/{{ workstation_providers.sync | default('syncthing') }}"
      vars:
        workstation_capability: sync
        workstation_provider_path: "{{ workstation_providers.sync | default('syncthing') }}"
      when:
        - workstation_capabilities.sync.enabled | default(true) | bool
        - workstation_providers.sync | default('syncthing') != 'none'
        # workstation_syncthing_enabled is handled inside the provider role,
        # so disabling it still stops the service on the next run.

    - name: Select vpn provider
      ansible.builtin.include_role:
        name: "providers/{{ workstation_providers.vpn | default('proton/vpn') }}"
      vars:
        workstation_capability: vpn
        workstation_provider_path: "{{ workstation_providers.vpn | default('proton/vpn') }}"
      when:
        - workstation_capabilities.vpn.enabled | default(true) | bool
        - workstation_providers.vpn | default('proton/vpn') != 'none'

    - name: Select backup provider
      ansible.builtin.include_role:
        name: "providers/{{ workstation_providers.backup | default('proton/drive') }}"
      vars:
        workstation_capability: backup
        workstation_provider_path: "{{ workstation_providers.backup | default('proton/drive') }}"
      when:
        - workstation_capabilities.backup.enabled | default(true) | bool
        - workstation_providers.backup | default('proton/drive') != 'none'
        # workstation_backup_enabled is handled inside the provider role,
        # so disabling backups still stops the timer on the next run.

    - name: Select passwords provider
      ansible.builtin.include_role:
        name: "providers/{{ workstation_providers.passwords | default('proton/pass') }}"
      vars:
        workstation_capability: passwords
        workstation_provider_path: "{{ workstation_providers.passwords | default('proton/pass') }}"
      when:
        - workstation_capabilities.passwords.enabled | default(true) | bool
        - workstation_providers.passwords | default('proton/pass') != 'none'

    - name: Select mail provider
      ansible.builtin.include_role:
        name: "providers/{{ workstation_providers.mail | default('proton/mail') }}"
      vars:
        workstation_capability: mail
        workstation_provider_path: "{{ workstation_providers.mail | default('proton/mail') }}"
      when:
        - workstation_capabilities.mail.enabled | default(true) | bool
        - workstation_providers.mail | default('proton/mail') != 'none'

  roles:
    - hardware
    - base
    - shell
    - bootstrap

    # Foundation roles gated by profile toggles (workstation_role_*, default true).
    - role: languages
      when: workstation_role_languages | default(true) | bool
    - role: containers
      when: workstation_role_containers | default(true) | bool
    - role: virtualization
      when: workstation_role_virtualization | default(true) | bool

    - role: gnome
      when:
        - workstation_role_gnome | default(true) | bool
        - workstation_hardware_has_gnome_session | default(false) | bool

    - maintenance

    - health
    - drift

    - role: backup_monitor
      when:
        - workstation_capabilities.backup.enabled | default(true) | bool
        - workstation_backup_enabled | default(true) | bool
        - workstation_backup_timer_enabled | default(false) | bool

    - weekly_report
    - desktop_alerts
    - tool_updates
    - tool_update_alerts
    - tool_update_policy
    - apt_update_review
    - post_update_validation
    - release_audit
    - workstation_console

  post_tasks:
    # Every selected provider role records its adapter contract (supported vs
    # manual actions) under ~/.local/state/workstation-provider/ during its run
    # (docs/MIGRATE.md section 5). Verify the records exist and are readable.
    - name: Collect provider contract records
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.local/state/workstation-provider/{{ workstation_providers[item.key] | replace('/', '__') }}.json"
      loop: "{{ workstation_capabilities | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: workstation_provider_contract_stats
      when:
        - item.value.enabled | default(true) | bool
        - workstation_providers[item.key] | default('') != 'none'
      check_mode: false

    - name: Assert every selected provider recorded its adapter contract
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isreg | default(false)
        fail_msg: >-
          Provider '{{ workstation_providers[item.item.key] }}' (capability '{{ item.item.key }}')
          did not record its adapter contract. Add a 'Record provider adapter contract'
          task writing ~/.local/state/workstation-provider/{{ workstation_providers[item.item.key] | replace('/', '__') }}.json
          (see docs/MIGRATE.md section 5 and CONTRIBUTING.md).
      loop: "{{ workstation_provider_contract_stats.results | default([]) }}"
      when: not ansible_check_mode

    - name: Show the active capability/provider selection
      ansible.builtin.debug:
        msg: >-
          {% for cap, cfg in workstation_capabilities.items() if cfg.enabled | default(true) %}
          {{ cap }} -> {{ workstation_providers[cap] | default('none') }}{{ ', ' if not loop.last }}
          {% endfor %}
