---
- name: Configure Ubuntu workstations
  hosts: workstations
  gather_facts: true

  roles:
    - hardware
    - base
    - shell
    - bootstrap
    - languages
    - containers
    - virtualization

    - role: gnome
      when: workstation_hardware_has_gnome_session | default(false) | bool

    - syncthing
    - proton
    - backup
