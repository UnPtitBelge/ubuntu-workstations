---
- name: Install QEMU utilities that do not require KVM
  become: true
  ansible.builtin.apt:
    name: "{{ workstation_virtualization_packages_base }}"
    state: present

- name: Install KVM-capable QEMU system package
  become: true
  ansible.builtin.apt:
    name: "{{ workstation_virtualization_packages_kvm }}"
    state: present
  when:
    - workstation_hardware_has_kvm | default(false) | bool
      or workstation_hardware_virtualization_role | default('') == 'guest'

- name: Skip KVM-capable QEMU on hardware without virtualization
  ansible.builtin.debug:
    msg: >-
      No /dev/kvm and not a guest VM: skipping {{ workstation_virtualization_packages_kvm | join(', ') }}.
      Multipass remains installed (it uses its own backend); standalone QEMU
      guests would fall back to slow emulation, so they are skipped by default.
  when:
    - not (workstation_hardware_has_kvm | default(false) | bool
           or workstation_hardware_virtualization_role | default('') == 'guest')

- name: Ensure Snap support is installed
  become: true
  ansible.builtin.apt:
    name: snapd
    state: present

- name: Check whether Multipass Snap is installed
  ansible.builtin.command:
    argv:
      - snap
      - list
      - multipass
  register: workstation_multipass_snap
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Multipass if missing
  become: true
  ansible.builtin.command:
    argv:
      - snap
      - install
      - multipass
      - "--channel={{ workstation_multipass_channel }}"
  when:
    - workstation_multipass_snap.rc != 0
    - not ansible_check_mode

- name: Report missing Multipass during check mode
  ansible.builtin.debug:
    msg: "Multipass would be installed during a normal run."
  when:
    - workstation_multipass_snap.rc != 0
    - ansible_check_mode

- name: Check KVM device availability
  ansible.builtin.stat:
    path: /dev/kvm
  register: workstation_kvm

- name: Report KVM status
  ansible.builtin.debug:
    msg: >-
      {{
        'KVM device detected.'
        if workstation_kvm.stat.exists
        else 'No /dev/kvm device detected. Check hardware virtualization support.'
      }}

- name: Verify Multipass version
  ansible.builtin.command:
    argv:
      - multipass
      - version
  register: workstation_multipass_version
  changed_when: false
  check_mode: false
  when:
    - workstation_multipass_snap.rc == 0
    - not ansible_check_mode

- name: Display Multipass version
  ansible.builtin.debug:
    var: workstation_multipass_version.stdout_lines
  when:
    - workstation_multipass_version is defined
    - workstation_multipass_version.stdout_lines is defined
