---
- name: Define GNOME user paths
  ansible.builtin.set_fact:
    workstation_gnome_home: "{{ ansible_facts['env']['HOME'] }}"
    workstation_gnome_runtime: "/run/user/{{ ansible_facts['user_uid'] }}"

- name: Define wallpaper destination
  ansible.builtin.set_fact:
    workstation_wallpaper_path: >-
      {{ workstation_gnome_home }}/.local/share/backgrounds/{{ workstation_wallpaper_filename }}

- name: Check GNOME session bus
  ansible.builtin.stat:
    path: "{{ workstation_gnome_runtime }}/bus"
  register: workstation_gnome_bus

- name: Require an active GNOME user session
  ansible.builtin.assert:
    that:
      - workstation_gnome_bus.stat.exists
    fail_msg: >-
      GNOME configuration requires an active user session.
      Run this role locally while logged into GNOME.

- name: Create wallpaper directory
  ansible.builtin.file:
    path: "{{ workstation_gnome_home }}/.local/share/backgrounds"
    state: directory
    mode: "0755"

- name: Install workstation wallpaper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/wallpapers/{{ workstation_wallpaper_filename }}"
    dest: "{{ workstation_wallpaper_path }}"
    mode: "0644"

- name: Read current GNOME settings
  ansible.builtin.command:
    argv:
      - gsettings
      - get
      - "{{ item.schema }}"
      - "{{ item.key }}"
  loop: "{{ workstation_gnome_settings }}"
  register: workstation_gnome_current
  changed_when: false
  check_mode: false
  environment:
    XDG_RUNTIME_DIR: "{{ workstation_gnome_runtime }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ workstation_gnome_runtime }}/bus"

- name: Apply GNOME settings
  ansible.builtin.command:
    argv:
      - gsettings
      - set
      - "{{ item.item.schema }}"
      - "{{ item.item.key }}"
      - "{{ item.item.value }}"
  loop: "{{ workstation_gnome_current.results }}"
  loop_control:
    label: "{{ item.item.schema }} {{ item.item.key }}"
  when: item.stdout | trim != item.item.expected
  environment:
    XDG_RUNTIME_DIR: "{{ workstation_gnome_runtime }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ workstation_gnome_runtime }}/bus"

- name: Read current wallpaper settings
  ansible.builtin.command:
    argv:
      - gsettings
      - get
      - org.gnome.desktop.background
      - "{{ item }}"
  loop:
    - picture-uri
    - picture-uri-dark
  register: workstation_wallpaper_current
  changed_when: false
  check_mode: false
  environment:
    XDG_RUNTIME_DIR: "{{ workstation_gnome_runtime }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ workstation_gnome_runtime }}/bus"

- name: Set GNOME wallpaper
  ansible.builtin.command:
    argv:
      - gsettings
      - set
      - org.gnome.desktop.background
      - "{{ item.item }}"
      - "file://{{ workstation_wallpaper_path }}"
  loop: "{{ workstation_wallpaper_current.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: >-
    item.stdout | trim !=
    ("'file://" ~ workstation_wallpaper_path ~ "'")
  environment:
    XDG_RUNTIME_DIR: "{{ workstation_gnome_runtime }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ workstation_gnome_runtime }}/bus"
