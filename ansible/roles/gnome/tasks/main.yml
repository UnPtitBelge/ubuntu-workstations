---
- name: Preflight GNOME desktop
  ansible.builtin.import_tasks: preflight.yml
- name: Install GNOME design dependencies
  ansible.builtin.import_tasks: packages.yml
- name: Validate selected GNOME theme assets
  ansible.builtin.import_tasks: validate.yml
- name: Apply GNOME look, dock and productivity preferences
  ansible.builtin.import_tasks: settings.yml
- name: Install and activate wallpaper
  ansible.builtin.import_tasks: wallpaper.yml
- name: Manage GNOME extensions
  ansible.builtin.import_tasks: extensions.yml
- name: Manage GNOME shortcuts
  ansible.builtin.import_tasks: shortcuts.yml
