---
- name: Install official Proton VPN
  ansible.builtin.import_tasks: vpn.yml
  when: workstation_proton_manage_vpn | bool

- name: Configure Proton Drive CLI
  ansible.builtin.import_tasks: drive.yml
  when: workstation_proton_drive_enabled

- name: Manage Proton Pass and Mail desktop applications
  ansible.builtin.import_tasks: desktop-apps.yml
