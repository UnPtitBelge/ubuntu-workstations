---
# Verified, pinned Proton desktop DEBs. Do not change VPN or Drive tasks.
- name: Validate architecture for Proton desktop apps
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: 'These pinned Proton desktop DEBs require amd64 (x86_64).'
  when: workstation_proton_pass_enabled | default(true) | bool or workstation_proton_mail_enabled | default(true) | bool

- name: Explain desktop package check mode
  ansible.builtin.debug:
    msg: >-
      Proton desktop apps: package download, inspection and installation are
      skipped in check mode. Run the playbook normally to converge.
  when: ansible_check_mode

- name: Prepare private Proton DEB cache
  become: true
  ansible.builtin.file:
    path: /var/cache/ansible/proton
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode and (workstation_proton_pass_enabled | default(true) | bool or workstation_proton_mail_enabled | default(true) | bool)

- name: Ensure Proton Pass is installed at or above approved version
  ansible.builtin.include_tasks: install-deb.yml
  vars:
    proton_desktop_app:
      name: Proton Pass
      version: '1.43.0'
      url: https://proton.me/download/pass/linux/proton-pass_1.43.0_amd64.deb
      sha512: ac19002dd7e5e6110fd5ca5d342d2cacbd2528d95966e83c1ac8df928e86506927d9cad1ffafaa1b542bb6ebf13aaa8f7b5e6d6499531a62aa82bbf82a706c62
      filename: proton-pass_1.43.0_amd64.deb
  when:
    - workstation_proton_pass_enabled | default(true) | bool
    - not ansible_check_mode

- name: Ensure Proton Mail is installed at or above approved stable version
  ansible.builtin.include_tasks: install-deb.yml
  vars:
    proton_desktop_app:
      name: Proton Mail
      version: '1.14.0'
      url: https://proton.me/download/mail/linux/1.14.0/ProtonMail-desktop-beta.deb
      sha512: 5908632fe34e3d40b698c9459bb774428a5b6aedd7c89ed9ff68394b90227c689a5a03ee719f9b3a4e20c7c4a69ce67fe40ab12e0f344359e9005c7be839d818
      filename: proton-mail_1.14.0_amd64.deb
  when:
    - workstation_proton_mail_enabled | default(true) | bool
    - not ansible_check_mode
