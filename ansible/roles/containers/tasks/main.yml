---
- name: Ensure APT keyring directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Docker repository signing key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Configure Docker APT repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' if ansible_facts['architecture'] == 'aarch64' else ansible_facts['architecture'] }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    enabled: true
  register: workstation_docker_repository

- name: Install Docker Engine and plugins
  become: true
  ansible.builtin.apt:
    name: "{{ workstation_docker_packages }}"
    state: present
    update_cache: "{{ workstation_docker_repository.changed }}"
    cache_valid_time: 3600

- name: Ensure Docker service is enabled and running
  become: true
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: workstation_docker_manage_service

- name: Check Docker version
  ansible.builtin.command:
    argv:
      - docker
      - --version
  register: workstation_docker_version
  changed_when: false
  check_mode: false

- name: Check Docker Compose version
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  register: workstation_compose_version
  changed_when: false
  check_mode: false

- name: Check Docker Buildx version
  ansible.builtin.command:
    argv:
      - docker
      - buildx
      - version
  register: workstation_buildx_version
  changed_when: false
  check_mode: false

- name: Display Docker versions
  ansible.builtin.debug:
    msg:
      - "{{ workstation_docker_version.stdout }}"
      - "{{ workstation_compose_version.stdout }}"
      - "{{ workstation_buildx_version.stdout }}"

# ─────────────────────────────────────────────
# Containerlab
# ─────────────────────────────────────────────

- name: Check installed Containerlab package
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${Version}"
      - containerlab
  register: containerlab_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Verify supported architecture
  ansible.builtin.assert:
    that:
      - workstation_containerlab_architecture in ['amd64', 'arm64']
    success_msg: >-
      Containerlab architecture: {{ workstation_containerlab_architecture }}
    fail_msg: >-
      Unsupported architecture:
      {{ ansible_facts['architecture'] }}
      (mapped to {{ workstation_containerlab_architecture }})

- name: Prevent unintended Containerlab upgrades or downgrades
  ansible.builtin.assert:
    that:
      - containerlab_installed.rc != 0 or
        containerlab_installed.stdout | trim ==
        workstation_containerlab_version
    fail_msg: >-
      Containerlab {{ containerlab_installed.stdout | trim }}
      is installed, but {{ workstation_containerlab_version }}
      is requested. Review the version change before proceeding.

- name: Download Containerlab Debian package
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/srl-labs/containerlab/releases/download/v{{ workstation_containerlab_version }}/containerlab_{{ workstation_containerlab_version }}_linux_{{ workstation_containerlab_architecture }}.deb
    dest: >-
      /var/cache/containerlab_{{ workstation_containerlab_version }}_linux_{{ workstation_containerlab_architecture }}.deb
    mode: "0644"
  when:
    - containerlab_installed.rc != 0

- name: Install Containerlab
  become: true
  ansible.builtin.apt:
    deb: >-
      /var/cache/containerlab_{{ workstation_containerlab_version }}_linux_{{ workstation_containerlab_architecture }}.deb
    state: present
  when:
    - containerlab_installed.rc != 0
    - not ansible_check_mode

- name: Verify Containerlab installation
  ansible.builtin.command:
    argv:
      - containerlab
      - version
  register: containerlab_version
  changed_when: false
  when:
    - containerlab_installed.rc == 0
    - not ansible_check_mode

- name: Display Containerlab version
  ansible.builtin.debug:
    var: containerlab_version.stdout_lines
  when:
    - containerlab_version is defined
    - containerlab_version.stdout_lines is defined
