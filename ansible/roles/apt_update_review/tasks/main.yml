---
- name: Ensure user executable directory exists
  become: false
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: '0755'

- name: Install controlled APT update review helper
  become: false
  ansible.builtin.copy:
    src: workstation-apt-update-review.py
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/workstation-apt-update-review"
    mode: '0755'
