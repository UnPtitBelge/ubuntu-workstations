---
- name: Validate maintenance platform
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] is version('26.04', '>=')
    fail_msg: 'This maintenance configuration was designed for Ubuntu 26.04 or later.'

- name: Install Ubuntu unattended security updates
  become: true
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: workstation_maintenance_security_updates_enabled | bool

- name: Manage workstation unattended-upgrades policy
  become: true
  ansible.builtin.template:
    src: 90-workstation-security-updates.conf.j2
    dest: /etc/apt/apt.conf.d/90-workstation-security-updates
    owner: root
    group: root
    mode: '0644'
  when: workstation_maintenance_security_updates_enabled | bool

- name: Enable and start Ubuntu APT maintenance timers
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  when:
    - workstation_maintenance_security_updates_enabled | bool
    - not ansible_check_mode

- name: Show configured maintenance policy
  ansible.builtin.debug:
    msg: >-
      Ubuntu security maintenance configured={{ workstation_maintenance_security_updates_enabled }};
      interval={{ workstation_maintenance_security_update_period_days }} day(s);
      automatic reboot={{ workstation_maintenance_automatic_reboot }}.
      No changes to third-party application updaters or development runtimes.
