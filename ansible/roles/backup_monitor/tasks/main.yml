---
- name: Validate Proton backup monitoring configuration
  ansible.builtin.assert:
    that:
      - workstation_backup_monitor_max_age_hours | int >= 1
      - workstation_backup_enabled | default(false) | bool
      - workstation_backup_timer_enabled | default(false) | bool
    fail_msg: >-
      Proton backup monitoring requires an enabled backup service and timer.
      Confirm workstation_backup_enabled and workstation_backup_timer_enabled.

- name: Check existing backup systemd unit of the selected provider
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/{{ workstation_backup_monitor_service }}"
  register: workstation_backup_monitor_source_unit

- name: Require the existing backup service of the selected provider
  ansible.builtin.assert:
    that:
      - workstation_backup_monitor_source_unit.stat.isreg | default(false)
    fail_msg: >-
      Missing {{ workstation_backup_monitor_service }}. Deploy the selected backup
      provider role first.

- name: Create backup monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    - "{{ ansible_facts['env']['HOME'] }}/.local/state/workstation-backup-monitor"
    - "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
    - "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/{{ workstation_backup_monitor_service }}.d"

- name: Install backup health checker
  ansible.builtin.template:
    src: workstation-backup-health-check.py.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/workstation-backup-health-check"
    mode: '0755'

- name: Record successful backup service completion
  ansible.builtin.copy:
    src: 10-success-stamp.conf
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/{{ workstation_backup_monitor_service }}.d/10-success-stamp.conf"
    mode: '0644'

- name: Install backup health service
  ansible.builtin.template:
    src: workstation-backup-health.service.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/workstation-backup-health.service"
    mode: '0644'

- name: Install backup health timer
  ansible.builtin.template:
    src: workstation-backup-health.timer.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/workstation-backup-health.timer"
    mode: '0644'

- name: Enable daily backup health monitoring
  ansible.builtin.systemd_service:
    name: workstation-backup-health.timer
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['user_uid'] }}/bus"
  when: not ansible_check_mode
