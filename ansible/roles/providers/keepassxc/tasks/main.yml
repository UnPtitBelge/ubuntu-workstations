---
# Passwords capability provider: KeePassXC. The vault database is created
# manually in the GUI on first launch; only its parent directory is managed.
- name: Install KeePassXC
  become: true
  ansible.builtin.apt:
    name: "{{ workstation_keepassxc_package }}"
    state: present
  when: workstation_keepassxc_enabled | bool

- name: Ensure the vault parent directory exists
  ansible.builtin.file:
    path: "{{ workstation_keepassxc_vault | dirname }}"
    state: directory
    mode: '0755'
  when: workstation_keepassxc_enabled | bool

- name: Explain manual vault enrollment
  ansible.builtin.debug:
    msg: >-
      KeePassXC installed. Create/open your vault at {{ workstation_keepassxc_vault }}
      on first launch. The vault is inside the backup sources, so it is backed
      up; keep it out of Git and out of Syncthing shares. The master password
      and key file stay on this machine (or in your password manager of last
      resort) — never in this repository.
  when: workstation_keepassxc_enabled | bool

# Adapter contract (docs/MIGRATE.md section 5): record which actions this
# provider implements vs. which remain manual, so the playbook can verify the
# record and tools like provider-preflight can consume it.
- name: Ensure provider contract state directory exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/state/workstation-provider"
    state: directory
    mode: '0755'
  when: not ansible_check_mode

- name: Record provider adapter contract
  become: false
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/state/workstation-provider/{{ workstation_provider_path | default(ansible_role_name) | replace('/', '__') }}.json"
    mode: '0644'
    content: >-
      {{ {'schema_version': 1,
          'capability': workstation_capability | default(''),
          'provider': workstation_provider_path | default(ansible_role_name),
          'supported_actions': workstation_provider_supported_actions,
          'manual_actions': workstation_provider_manual_actions,
          'recorded_at': ansible_facts['date_time'].iso8601 } | to_nice_json }}
  when: not ansible_check_mode
