---
# Passwords capability provider: KeePassXC with a local vault file.
# The vault lives inside the backup sources by default, so it is backed up;
# it is never committed to Git. For a self-hosted server (Vaultwarden),
# see docs/PROVIDERS.md.
workstation_keepassxc_enabled: true
workstation_keepassxc_package: keepassxc
workstation_keepassxc_vault: "{{ ansible_facts['env']['HOME'] }}/Documents/Passwords.kdbx"

# Adapter contract (docs/MIGRATE.md section 5): actions this provider
# implements vs. actions that remain manual. Recorded during provisioning at
# ~/.local/state/workstation-provider/<provider>.json and verified by the playbook.
workstation_provider_supported_actions: [install, configure, health]
workstation_provider_manual_actions: [export, import, verify, cutover, disable]
