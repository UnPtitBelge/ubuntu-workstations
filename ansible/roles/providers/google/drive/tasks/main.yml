---
- name: Record the backup units watched by the backup monitor
  ansible.builtin.set_fact:
    workstation_backup_monitor_service: workstation-rclone-backup.service
    workstation_backup_monitor_timer: workstation-rclone-backup.timer

- name: Detect deployed rclone backup timer when backups disabled
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/workstation-rclone-backup.timer"
  register: disabled_rclone_timer_file
  when: not workstation_backup_enabled | bool

- name: Disable and stop deployed rclone backup timer when backups disabled
  ansible.builtin.systemd_service:
    name: workstation-rclone-backup.timer
    scope: user
    daemon_reload: true
    enabled: false
    state: stopped
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['user_uid'] }}/bus"
  when:
    - not workstation_backup_enabled | bool
    - disabled_rclone_timer_file.stat.exists | default(false)
    - not ansible_check_mode

- name: Install rclone
  become: true
  ansible.builtin.apt:
    name: rclone
    state: present
  when: workstation_backup_enabled | bool

- name: Ensure user-local directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    - "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
    - "{{ ansible_facts['env']['HOME'] }}/.config/workstation-rclone-backup"
    - "{{ workstation_rclone_config_dir }}"
  when: workstation_backup_enabled | bool

- name: Validate backup provider configuration
  ansible.builtin.assert:
    that:
      - workstation_rclone_remote is match('^[A-Za-z0-9_.-]+$')
      - workstation_backup_sources | length > 0
      - workstation_backup_sources | unique | list | length == workstation_backup_sources | length
      - workstation_backup_dataset_id is match('^[A-Za-z0-9._-]+$')
    fail_msg: 'Check the rclone remote name, backup sources and dataset id.'
  when: workstation_backup_enabled | bool

- name: Install rclone backup exclusion rules
  ansible.builtin.template:
    src: excludes.txt.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/workstation-rclone-backup/excludes.txt"
    mode: '0600'
  when: workstation_backup_enabled | bool

- name: Install rclone backup script
  ansible.builtin.template:
    src: workstation-rclone-backup.sh.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/workstation-rclone-backup"
    mode: '0700'
  when: workstation_backup_enabled | bool

- name: Install rclone backup user service
  ansible.builtin.template:
    src: workstation-rclone-backup.service.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/workstation-rclone-backup.service"
    mode: '0644'
  when: workstation_backup_enabled | bool

- name: Install rclone backup user timer
  ansible.builtin.template:
    src: workstation-rclone-backup.timer.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/workstation-rclone-backup.timer"
    mode: '0644'
  when: workstation_backup_enabled | bool

- name: Manage rclone backup timer
  ansible.builtin.systemd_service:
    name: workstation-rclone-backup.timer
    scope: user
    daemon_reload: true
    enabled: "{{ workstation_backup_timer_enabled | bool }}"
    state: "{{ 'started' if workstation_backup_timer_enabled else 'stopped' }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['user_uid'] }}/bus"
  when:
    - workstation_backup_enabled | bool
    - not ansible_check_mode

- name: Install shared backup manifest helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/workstation-backup-manifest.py"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/workstation-backup-manifest"
    mode: '0755'
  when: workstation_backup_enabled | bool

- name: Install rclone restore-test script (monthly drill)
  ansible.builtin.template:
    src: workstation-rclone-backup-restore-test.sh.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/workstation-rclone-backup-restore-test"
    mode: '0700'
  when: workstation_backup_enabled | bool

- name: Install rclone restore-test user service
  ansible.builtin.template:
    src: workstation-rclone-backup-restore-test.service.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/workstation-rclone-backup-restore-test.service"
    mode: '0644'
  when: workstation_backup_enabled | bool

- name: Install rclone restore-test user timer
  ansible.builtin.template:
    src: workstation-rclone-backup-restore-test.timer.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/workstation-rclone-backup-restore-test.timer"
    mode: '0644'
  when: workstation_backup_enabled | bool

- name: Enable monthly rclone restore drill
  become: false
  ansible.builtin.systemd_service:
    name: workstation-rclone-backup-restore-test.timer
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['user_uid'] }}/bus"
  when:
    - workstation_backup_enabled | bool
    - workstation_backup_timer_enabled | bool
    - not ansible_check_mode

# Adapter contract (docs/MIGRATE.md section 5): record which actions this
# provider implements vs. which remain manual, so the playbook can verify the
# record and tools like provider-preflight can consume it.
- name: Ensure provider contract state directory exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/state/workstation-provider"
    state: directory
    mode: '0755'
  when: not ansible_check_mode

- name: Record provider adapter contract
  become: false
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/state/workstation-provider/{{ workstation_provider_path | default(ansible_role_name) | replace('/', '__') }}.json"
    mode: '0644'
    content: >-
      {{ {'schema_version': 1,
          'capability': workstation_capability | default(''),
          'provider': workstation_provider_path | default(ansible_role_name),
          'supported_actions': workstation_provider_supported_actions,
          'manual_actions': workstation_provider_manual_actions,
          'recorded_at': ansible_facts['date_time'].iso8601 } | to_nice_json }}
  when: not ansible_check_mode
