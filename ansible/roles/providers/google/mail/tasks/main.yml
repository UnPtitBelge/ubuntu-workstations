---
# Mail capability provider: Thunderbird. Account setup (IMAP/SMTP server,
# OAuth for Gmail etc.) is intentionally manual and machine-local.
- name: Install Thunderbird
  become: true
  ansible.builtin.apt:
    name: "{{ workstation_thunderbird_package }}"
    state: present
  when: workstation_thunderbird_enabled | bool

- name: Explain manual mail account enrollment
  ansible.builtin.debug:
    msg: >-
      Thunderbird installed. Add your account(s) manually in the GUI
      (IMAP/SMTP; for Gmail use the OAuth sign-in). Credentials stay in the
      profile/keyring on this machine — never in Git. For a self-hosted mail
      server, point Thunderbird at your server's IMAP/SMTP endpoints
      (docs/PROVIDERS.md, self-hosted example).
  when: workstation_thunderbird_enabled | bool

# Adapter contract (docs/MIGRATE.md section 5): record which actions this
# provider implements vs. which remain manual, so the playbook can verify the
# record and tools like provider-preflight can consume it.
- name: Ensure provider contract state directory exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/state/workstation-provider"
    state: directory
    mode: '0755'
  when: not ansible_check_mode

- name: Record provider adapter contract
  become: false
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/state/workstation-provider/{{ workstation_provider_path | default(ansible_role_name) | replace('/', '__') }}.json"
    mode: '0644'
    content: >-
      {{ {'schema_version': 1,
          'capability': workstation_capability | default(''),
          'provider': workstation_provider_path | default(ansible_role_name),
          'supported_actions': workstation_provider_supported_actions,
          'manual_actions': workstation_provider_manual_actions } | to_nice_json }}
  when: not ansible_check_mode
