---
# Guidance-only provider: the user supplies their own implementation by
# dropping a role at ansible/roles/providers/<name>/ and selecting it via
# workstation_providers.<capability>: <name>. Contract: docs/MIGRATE.md section 5.
- name: Explain the custom provider contract
  ansible.builtin.debug:
    msg: >-
      Capability '{{ workstation_capability | default('unknown') }}' uses provider 'custom':
      no built-in implementation is deployed. To use your own (self-hosted VPS,
      other vendor, ...), create ansible/roles/providers/<vendor>/<name>/ in your
      clone (see docs/PROVIDERS.md and CONTRIBUTING.md) and set
      workstation_providers.{{ workstation_capability | default('?') }}: <vendor>/<name>.
      Provider contract (docs/MIGRATE.md section 5): implement install/configure/health;
      implement export/import/verify only where the backend supports them and mark
      them manual otherwise. Health output: ~/.local/state/workstation-<capability>/latest.txt
      with exactly one OVERALL line (register it in workstation_report_sources).
      Backup providers must additionally write
      ~/.local/state/workstation-backup/status.json (schema in docs/MIGRATE.md section 5).
      Secrets (tokens, keys, app passwords) stay in ~/.config or the keyring — never in Git.

# Adapter contract (docs/MIGRATE.md section 5): record which actions this
# provider implements vs. which remain manual, so the playbook can verify the
# record and tools like provider-preflight can consume it.
- name: Ensure provider contract state directory exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/state/workstation-provider"
    state: directory
    mode: '0755'
  when: not ansible_check_mode

- name: Record provider adapter contract
  become: false
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/state/workstation-provider/{{ workstation_provider_path | default(ansible_role_name) | replace('/', '__') }}.json"
    mode: '0644'
    content: >-
      {{ {'schema_version': 1,
          'capability': workstation_capability | default(''),
          'provider': workstation_provider_path | default(ansible_role_name),
          'supported_actions': workstation_provider_supported_actions,
          'manual_actions': workstation_provider_manual_actions } | to_nice_json }}
  when: not ansible_check_mode
