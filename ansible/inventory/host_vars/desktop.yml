---
# Desktop workstation

workstation_device_class: desktop
# Machine identity: the runtime hostname is used by default and is never stored
# in Git. To pin it explicitly (the playbook then asserts it matches the runtime
# hostname and is unique across the inventory), put it in a gitignored
# host_vars/desktop/local.yml:
#   workstation_device_name: <your-hostname>

# Preserve independent Syncthing configuration.
workstation_syncthing_enabled: true

# Prepare Proton backups, but do not schedule
# them until authentication and restore testing succeed.
workstation_backup_enabled: true
