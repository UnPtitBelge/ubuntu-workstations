---
workstation_base_packages:
  - ca-certificates
  - curl
  - wget
  - git
  - fish
  - jq
  - rsync
  - stow
  - unzip
  - zip
  - htop
  - btop
  - tree

workstation_development_packages:
  - build-essential
  - cmake
  - ninja-build
  - gdb
  - pkg-config

# Shell configuration

workstation_shell_packages:
  - fish
  - fzf
  - ripgrep
  - fd-find
  - bat
  - eza
  - tmux
  - htop
  - btop
  - zoxide
  - starship
  - glow

# Development toolchains

workstation_python_versions:
  - "3.12.13"
  - "3.13.14"

# uv-managed Python tools. Intentionally empty in the shared defaults;
# add the tools you want per host (host_vars) or here, for example:
#   - name: some-tool
#     version: "1.2.3"
workstation_python_tools: []

workstation_rust_toolchain: stable

# Reports consolidated by the weekly report and the GNOME desktop alert
# checker. Register a new monitor here. `expected` is the OVERALL status that
# counts as healthy; `max_age_hours` (optional) overrides the checker default
# for that source (e.g. weekly reports need more than the 48h default).
workstation_report_sources:
  - name: System health
    path: .local/state/workstation-health/latest.txt
    expected: HEALTHY
  - name: Configuration drift
    path: .local/state/workstation-drift/latest.txt
    expected: NO DRIFT DETECTED
  - name: Proton Drive backup
    path: .local/state/workstation-backup-monitor/latest.txt
    expected: HEALTHY
  - name: Development tool updates
    path: .local/state/workstation-tool-updates/latest.txt
    expected: HEALTHY
    max_age_hours: 192

# Setup profile (multi-setup): profiles/<workstation_profile>.yml provides the
# defaults for everything below, loaded here at inventory level so host_vars can
# still override any individual key per machine. The default profile reproduces
# the original full desktop setup, so existing hosts see no behavior change.
workstation_profile: developer_gnome
_profile_data: "{{ lookup('file', inventory_dir ~ '/../../profiles/' ~ workstation_profile ~ '.yml') | from_yaml }}"

workstation_capabilities: "{{ _profile_data.workstation_capabilities | default({'backup': {'enabled': true}, 'sync': {'enabled': true}, 'vpn': {'enabled': true}, 'mail': {'enabled': true}, 'passwords': {'enabled': true}}) }}"
workstation_providers: "{{ _profile_data.workstation_providers | default({'backup': 'proton/drive', 'sync': 'syncthing', 'vpn': 'proton/vpn', 'mail': 'proton/mail', 'passwords': 'proton/pass'}) }}"

# Foundation role toggles (profiles override these; all default to true).
workstation_role_gnome: "{{ _profile_data.workstation_role_gnome | default(true) }}"
workstation_role_containers: "{{ _profile_data.workstation_role_containers | default(true) }}"
workstation_role_virtualization: "{{ _profile_data.workstation_role_virtualization | default(true) }}"
workstation_role_languages: "{{ _profile_data.workstation_role_languages | default(true) }}"

# Enable flags and health-check lists (profiles may override; defaults = original).
workstation_backup_enabled: "{{ _profile_data.workstation_backup_enabled | default(true) }}"
workstation_backup_timer_enabled: "{{ _profile_data.workstation_backup_timer_enabled | default(true) }}"
workstation_syncthing_enabled: "{{ _profile_data.workstation_syncthing_enabled | default(true) }}"
workstation_health_system_services: "{{ _profile_data.workstation_health_system_services | default(['docker.service']) }}"
workstation_health_user_services: "{{ _profile_data.workstation_health_user_services | default(['syncthing.service']) }}"

# Capability switches and provider selection semantics: see docs/DEPLOY.md
# section 4, docs/PROVIDERS.md and docs/MIGRATE.md section 5. Set a provider to
# 'none' (with the capability enabled) to skip it, or drop your own role into
# ansible/roles/providers/<vendor>/<name>/ and select <vendor>/<name>.

# Supported platform and minimum tool versions (asserted by
# playbooks/workstation.yml before any role runs; see docs/DEPLOY.md section 2).
workstation_supported_distribution: Ubuntu
workstation_supported_release: '26.04'
workstation_min_ansible_core: '2.18.0'
workstation_min_python: '3.12'

# Capability-level backup settings shared by every backup provider
# (providers/proton/drive, providers/google/drive, ...). Provider-specific
# settings (remote destination, CLI) stay in the provider role's defaults.

# Each backup run writes (and uploads) a manifest with per-file SHA-256
# checksums, so migrations can compare datasets without trusting UI totals.
workstation_backup_manifest_enabled: true

# Complete folders are uploaded, preserving their folder names at destination.
workstation_backup_sources:
  - "{{ ansible_facts['env']['HOME'] }}/Documents"
  - "{{ ansible_facts['env']['HOME'] }}/Sync"

# Dataset identifier written to the normalized backup status record
# (~/.local/state/workstation-backup/status.json) consumed by the backup
# monitor. Safe charset only: letters, digits, dot, underscore, dash.
workstation_backup_dataset_id: home-selected

# Cron-like systemd schedule for the backup timer.
workstation_backup_on_calendar: '*-*-* 20:00:00'
workstation_backup_randomized_delay: '30m'

# Monthly restore drill: a scheduled, read-only-on-the-remote test that
# downloads one backed-up file to a separate temporary location and compares
# its SHA-256 with the local source. The result is recorded in
# ~/.local/state/workstation-backup/status.json (verified_restore_at) and
# restore-tests.jsonl. The backup monitor warns when the last verified
# restore is older than workstation_backup_monitor_restore_max_age_hours.
workstation_backup_restore_test_calendar: monthly
workstation_backup_restore_test_randomized_delay: 2h
workstation_backup_monitor_restore_max_age_hours: 1080

# Ignore patterns use rsync/rclone filter syntax. Directory rules ending in /
# match anywhere below each source. Intentionally do NOT exclude .git/ by
# default: unpushed commits and branches may exist only on this machine.
workstation_backup_excludes:
  # Python
  - '.venv/'
  - 'venv/'
  - 'env/'
  - '__pycache__/'
  - '*.pyc'
  - '*.pyo'
  - '*.pyd'
  - '.pytest_cache/'
  - '.mypy_cache/'
  - '.ruff_cache/'
  - '.hypothesis/'
  - '.tox/'
  - '.nox/'
  - '*.egg-info/'
  - '.coverage'
  - '.coverage.*'
  - 'htmlcov/'
  # JS / front-end
  - 'node_modules/'
  - '.npm/'
  - '.pnpm-store/'
  - '.yarn/cache/'
  - '.next/'
  - '.nuxt/'
  - '.turbo/'
  - '.parcel-cache/'
  # Generated build artifacts (remove these rules if they contain useful files)
  - 'build/'
  - 'dist/'
  - 'target/'
  - '.gradle/'
  - '.terraform/'
  # Cache, sync versioning, OS/editor metadata
  - '.cache/'
  - '.stversions/'
  - '.DS_Store'
  - 'Thumbs.db'
  - 'desktop.ini'
  - '*.swp'
  - '*.swo'
  - '*~'
  - '*.tmp'
  - '*.log'
  - '.syncthing.*.tmp'
