version: 2

updates:
  # GitHub Actions used by .github/workflows/ci.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Python dependencies for CI checks and repository scripts (requirements.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
